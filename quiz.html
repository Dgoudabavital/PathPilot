{% extends 'base.html' %}{% block content %}<div class="sectionhead"><div><span class="pill">DAY {{item.day}} QUIZ</span><h1>{{item.topic}}</h1><p>10 questions • practice + active recall • submit to see your score immediately</p></div></div><form class="quiz card" method="post">{% for q in item.quiz %}<fieldset><legend>{{q.id}}. {{q.question}}</legend>{% for opt in q.options %}<label class="option"><input type="radio" name="q{{q.id}}" value="{{loop.index0}}" required><span>{{opt}}</span></label>{% endfor %}</fieldset>{% endfor %}<button class="btn primary">Submit quiz & show score</button></form>{% endblock %}
